<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Warm background rounded square -->
  <rect width="128" height="128" rx="28" fill="#F8F6F0" />
  
  <g transform="translate(-18, 5) scale(0.64)">
    <!-- Letters: J, A, M -->
    <g stroke="#1C1917" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
      <!-- J -->
      <path d="M 68 46 L 68 110 C 68 131 53 146 36 146 C 19 146 6 133 6 119 L 6 114" />
      
      <!-- A -->
      <path d="M 82 146 L 128 46 L 174 146" />
      
      <!-- M -->
      <path d="M 188 146 L 188 46 L 232 112 L 276 46 L 276 146" />
    </g>

    <!-- Terracotta Sealant Bead in Center of M -->
    <line x1="232" y1="146" x2="232" y2="58" stroke="#C47D59" stroke-width="7.5" stroke-linecap="butt" />

    <!-- Silicone Caulking Gun at (232, 58) angled at -40° -->
    <g transform="translate(232, 58) rotate(-40)" fill="#1C1917" stroke="#1C1917">
      <polygon points="0,-1.5 13,-3.5 13,3.5 0,1.5" stroke="none" />
      <polygon points="13,-6 16,-6 16,6 13,6" stroke="none" />
      <rect x="16" y="-5" width="36" height="10" rx="0.5" stroke="none" />
      <line x1="16" y1="6.5" x2="52" y2="6.5" stroke-width="1.8" stroke-linecap="round" />
      <polygon points="52,-7 55,-7 55,7 52,7" stroke="none" />
      <path d="M 55,-7 L 65,-7 L 65,3 L 55,3 Z" stroke="none" />
      <path d="M 59,3 L 64,24 L 70,24 L 65,3 Z" stroke="none" stroke-linejoin="round" />
      <path d="M 56,4 C 56,8 58,13 57,15" stroke-width="2" stroke-linecap="round" fill="none" />
      <line x1="55" y1="-0.5" x2="84" y2="-0.5" stroke-width="3" stroke-linecap="square" fill="none" />
      <path d="M 84,-0.5 L 84,10 C 84,11.5 82,12.5 80,11.5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>
